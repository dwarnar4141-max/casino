<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Texas Hold'em Poker</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            background-color: #0f172a;
            color: white;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .balance-card {
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            padding: 30px;
            border-radius: 20px;
            border: 1px solid #D4AF37;
            text-align: center;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
        }
        h1 { color: #D4AF37; margin-bottom: 10px; }
        .amount { font-size: 40px; font-weight: bold; color: #00FF41; }
        button {
            margin-top: 20px;
            padding: 15px 30px;
            border-radius: 10px;
            border: none;
            background: #D4AF37;
            color: black;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="balance-card">
        <h1 id="user-name">Загрузка...</h1>
        <p>Ваш баланс в сомах:</p>
        <div class="amount" id="balance">0.00</div>
        <button onclick="Telegram.WebApp.close()">Выйти в меню</button>
    </div>

    <script>
        // Инициализация Telegram Web App
        const tg = window.Telegram.WebApp;
        tg.expand(); // Разворачиваем на весь экран

        // Получаем данные пользователя
        const user = tg.initDataUnsafe?.user;
        if (user) {
            document.getElementById('user-name').innerText = `Привет, ${user.first_name}!`;
        }

        // В будущем здесь будет запрос к нашему API для получения реального баланса из БД
        // Пока просто показываем, что мост работает
        document.getElementById('balance').innerText = "1250.00"; 

        // Настройка главной кнопки Telegram (Main Button)
        tg.MainButton.text = "НАЧАТЬ ИГРУ";
        tg.MainButton.textColor = "#000000";
        tg.MainButton.color = "#D4AF37";
        tg.MainButton.show();

        tg.onEvent('mainButtonClicked', function(){
            tg.showAlert("Игра скоро начнется! Настраиваем столы...");
        });
    </script>
</body>
</html>
