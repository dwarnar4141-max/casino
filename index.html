<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AndoCasino WebApp</title>
    <!-- Подключаем Telegram Web App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-color: #ffffff;
            --text-muted: #888888;
            --accent-color: #ff3838; /* Яркий красный под цвет панды */
            --gold: #ffb142;
            --neon-glow: rgba(255, 56, 56, 0.15);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: '-apple-system', BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            -webkit-user-select: none;
            user-select: none;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Контентная зона */
        .content-screen {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: none;
            padding-bottom: 90px;
        }

        .content-screen.active {
            display: block;
        }

        h2 {
            margin-bottom: 20px;
            font-size: 22px;
            text-align: center;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        /* Навигация (вкладки снизу) */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 75px;
            background-color: #181818;
            display: flex;
            justify-content: space-around;
            align-items: center;
            border-top: 1px solid #282828;
            z-index: 1000;
            padding-bottom: env(safe-area-inset-bottom); /* Поддержка челок айфонов */
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
            font-size: 11px;
            letter-spacing: 0.5px;
            text-decoration: none;
            cursor: pointer;
            width: 33.3%;
            height: 100%;
            transition: all 0.2s ease;
        }

        .nav-item .icon {
            font-size: 24px;
            margin-bottom: 4px;
            transition: transform 0.2s ease;
        }

        .nav-item.active {
            color: var(--accent-color);
        }

        .nav-item.active .icon {
            transform: scale(1.15);
        }

        /* =====================================================================
           ЭКРАН ПРОФИЛЯ С КРАСНОЙ ПАНДОЙ
           ===================================================================== */
        .profile-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 10px;
        }

        .panda-mascot-box {
            position: relative;
            width: 100%;
            max-width: 340px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Настройка нашей панды из файла ChatGPT Image 4 июн. 2026 г., 23_29_25.png */
        .panda-image {
            width: 160px;
            height: 160px;
            z-index: 2;
            /* Панда слегка наплывает лапками на карточку, которая ниже */
            margin-bottom: -25px; 
            filter: drop-shadow(0px 8px 12px rgba(0, 0, 0, 0.5));
            animation: pandaFloat 4s ease-in-out infinite;
        }

        /* Плавное покачивание панды на экране */
        @keyframes pandaFloat {
            0% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-6px) rotate(1deg); }
            100% { transform: translateY(0px) rotate(0deg); }
        }

        /* Главная карточка профиля, которую держит панда */
        .profile-main-card {
            background: linear-gradient(145deg, #222222, #1a1a1a);
            border-radius: 24px;
            width: 100%;
            padding: 35px 20px 24px 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6), 
                        0 0 20px var(--neon-glow); /* Неоновое красное свечение */
            border: 1px solid rgba(255, 56, 56, 0.15);
            text-align: center;
            z-index: 1;
        }

        .profile-username {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 18px;
            letter-spacing: 0.5px;
        }

        /* Плашка баланса */
        .balance-badge {
            background: linear-gradient(90deg, rgba(255, 56, 56, 0.08), rgba(255, 177, 66, 0.05));
            border: 1px solid rgba(255, 56, 56, 0.2);
            padding: 14px;
            border-radius: 16px;
            margin-bottom: 22px;
        }

        .balance-title {
            font-size: 11px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }

        .balance-value {
            font-size: 28px;
            font-weight: 800;
            color: var(--gold);
            margin-top: 4px;
            text-shadow: 0 2px 10px rgba(255, 177, 66, 0.2);
        }

        /* Сетка характеристик */
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 14px;
            padding: 12px 14px;
            text-align: left;
        }

        .stat-label {
            font-size: 11px;
            color: var(--text-muted);
        }

        .stat-val {
            font-size: 16px;
            font-weight: 700;
            margin-top: 4px;
        }

        /* =====================================================================
           ЭКРАН ТОП
           ===================================================================== */
        .top-tabs {
            display: flex;
            background: #1e1e1e;
            border-radius: 12px;
            padding: 4px;
            margin-bottom: 18px;
            border: 1px solid #282828;
        }

        .top-tab-btn {
            flex: 1;
            background: none;
            border: none;
            color: var(--text-muted);
            padding: 10px 0;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            border-radius: 9px;
            transition: all 0.2s ease;
        }

        .top-tab-btn.active {
            background: var(--accent-color);
            color: white;
            box-shadow: 0 4px 12px rgba(255, 56, 56, 0.3);
        }

        .leaderboard-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .leader-item {
            display: flex;
            align-items: center;
            background: var(--card-bg);
            padding: 14px 18px;
            border-radius: 16px;
            justify-content: space-between;
            border: 1px solid #262626;
        }

        .leader-left {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .leader-rank {
            font-weight: 800;
            width: 24px;
            font-size: 16px;
            color: var(--text-muted);
        }

        .leader-rank.rank-1 { color: #ffb142; }
        .leader-rank.rank-2 { color: #f1f2f6; }
        .leader-rank.rank-3 { color: #ffa502; }

        .leader-name {
            font-size: 15px;
            font-weight: 600;
        }

        .leader-score {
            font-weight: 700;
            color: var(--gold);
        }

        /* =====================================================================
           ЭКРАН ИГРЫ
           ===================================================================== */
        .games-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .game-card {
            background: linear-gradient(135deg, #1e1e1e, #161616);
            border-radius: 18px;
            padding: 25px 15px;
            text-align: center;
            border: 1px solid #282828;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .game-card:active {
            transform: scale(0.96);
            border-color: var(--accent-color);
        }

        .game-icon {
            font-size: 44px;
            margin-bottom: 12px;
        }

        .game-title {
            font-weight: 600;
            font-size: 15px;
        }
    </style>
</head>
<body>

    <!-- ЭКРАН 1: ИГРЫ -->
    <div id="screen-games" class="content-screen active">
        <h2>🎮 Игровые Режимы</h2>
        <div class="games-grid">
            <div class="game-card" onclick="alert('Запуск режима Минёр...')">
                <div class="game-icon">💣</div>
                <div class="game-title">Минёр (Mines)</div>
            </div>
            <div class="game-card" onclick="alert('Запуск режима Dice...')">
                <div class="game-icon">🎲</div>
                <div class="game-title">Dice (H-L)</div>
            </div>
            <div class="game-card" onclick="alert('Запуск режима Слоты...')">
                <div class="game-icon">🎰</div>
                <div class="game-title">Слот-Машина</div>
            </div>
            <div class="game-card" onclick="alert('Запуск Колеса Фортуны...')">
                <div class="game-icon">🎡</div>
                <div class="game-title">Wheel</div>
            </div>
        </div>
    </div>

    <!-- ЭКРАН 2: ТОП ИГРОКОВ -->
    <div id="screen-top" class="content-screen">
        <h2>🏆 Топ Лидеров</h2>
        <div class="top-tabs">
            <button class="top-tab-btn active" onclick="switchTopTab(this, 'day')">День</button>
            <button class="top-tab-btn" onclick="switchTopTab(this, 'week')">Неделя</button>
            <button class="top-tab-btn" onclick="switchTopTab(this, 'month')">Месяц</button>
        </div>
        
        <div class="leaderboard-list" id="leaderboard">
            <div class="leader-item">
                <div class="leader-left">
                    <span class="leader-rank rank-1">1</span>
                    <span class="leader-name">Donya</span>
                </div>
                <span class="leader-score">45,200 AC</span>
            </div>
            <div class="leader-item">
                <div class="leader-left">
                    <span class="leader-rank rank-2">2</span>
                    <span class="leader-name">Alex_Bet</span>
                </div>
                <span class="leader-score">31,000 AC</span>
            </div>
            <div class="leader-item">
                <div class="leader-left">
                    <span class="leader-rank rank-3">3</span>
                    <span class="leader-name">Jennie_Fan</span>
                </div>
                <span class="leader-score">18,500 AC</span>
            </div>
        </div>
    </div>

    <!-- ЭКРАН 3: ПРОФИЛЬ -->
    <div id="screen-profile" class="content-screen">
        <h2>👤 Личный Кабинет</h2>
        <div class="profile-container">
            
            <div class="panda-mascot-box">
                <!-- КРАСНАЯ ПАНДА: Подключаем изображение маскота -->
                <img src="panda.png" alt="Panda Mascot" class="panda-image">
                
                <!-- Плашка профиля -->
                <div class="profile-main-card">
                    <div class="profile-username" id="user-name">Загрузка...</div>
                    
                    <div class="balance-badge">
                        <div class="balance-title">Текущий баланс</div>
                        <div class="balance-value" id="user-balance">0 ACoin</div>
                    </div>
                    
                    <div class="stats-grid">
                        <div class="stat-card">
                            <div class="stat-label">Винрейт</div>
                            <div class="stat-val" id="stat-winrate">54%</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-label">Топ Коэф.</div>
                            <div class="stat-val" id="stat-max-coef">x14.5</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-label">Макс. Выигрыш</div>
                            <div class="stat-val" id="stat-max-win">2,500 AC</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-label">Статус</div>
                            <div class="stat-val" style="color: var(--accent-color);">Новичок</div>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <!-- НИЖНЯЯ НАВИГАЦИЯ -->
    <div class="bottom-nav">
        <div class="nav-item active" onclick="switchTab('games', this)">
            <span class="icon">🎮</span>
            <span>ИГРЫ</span>
        </div>
        <div class="nav-item" onclick="switchTab('top', this)">
            <span class="icon">🏆</span>
            <span>ТОП</span>
        </div>
        <div class="nav-item" onclick="switchTab('profile', this)">
            <span class="icon">👤</span>
            <span>ПРОФИЛЬ</span>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
            document.getElementById('user-name').innerText = tg.initDataUnsafe.user.first_name;
        } else {
            document.getElementById('user-name').innerText = "Игрок";
        }

        function switchTab(screenId, element) {
            document.querySelectorAll('.content-screen').forEach(screen => screen.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active'));

            document.getElementById(`screen-${screenId}`).classList.add('active');
            element.classList.add('active');
            
            if (tg.HapticFeedback) {
                tg.HapticFeedback.impactOccurred('light');
            }
        }

        function switchTopTab(btn, timeFrame) {
            document.querySelectorAll('.top-tab-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            
            if (tg.HapticFeedback) {
                tg.HapticFeedback.impactOccurred('light');
            }
            console.log("Сортировка топа по: " + timeFrame);
        }
    </script>
</body>
</html>
