<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AndoCasino Premium</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #0d0e12;
            --card-bg: #14161d;
            --card-inner: #1b1e26;
            --text-color: #ffffff;
            --text-muted: #6c7284;
            --accent-color: #00ff87;
            --danger-color: #ff3838;
            --gold: #f1c40f;
            --border-color: rgba(255, 255, 255, 0.05);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            overflow-x: hidden;
            padding-bottom: 80px;
        }

        header {
            background: var(--card-bg);
            padding: 16px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .avatar {
            width: 42px;
            height: 42px;
            background: var(--accent-color);
            color: #000;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 18px;
        }

        .user-info h1 {
            font-size: 15px;
            margin-bottom: 2px;
        }

        .balance {
            font-size: 13px;
            color: var(--accent-color);
            font-weight: bold;
        }

        .content-screen {
            display: none;
            padding: 16px;
        }

        .content-screen.active {
            display: block;
        }

        h2 {
            font-size: 20px;
            margin-bottom: 16px;
            font-weight: 700;
        }

        .mines-panel {
            background: var(--card-bg);
            padding: 16px;
            border-radius: 16px;
            border: 1px solid var(--border-color);
            margin-bottom: 16px;
        }

        .form-group {
            flex: 1;
        }

        .form-group label {
            font-size: 11px;
            color: var(--text-muted);
            display: block;
            margin-bottom: 6px;
        }

        .form-group input, .form-group select {
            width: 100%;
            background: var(--card-inner);
            border: 1px solid var(--border-color);
            color: #fff;
            padding: 12px;
            border-radius: 10px;
            font-weight: bold;
            outline: none;
            font-size: 14px;
        }

        .btn-action {
            flex: 1;
            border: none;
            padding: 14px;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
        }

        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 64px;
            background: rgba(20, 22, 29, 0.95);
            backdrop-filter: blur(10px);
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding-bottom: env(safe-area-inset-bottom);
            z-index: 1000;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: var(--text-muted);
            font-size: 10px;
            gap: 4px;
            cursor: pointer;
            width: 60px;
        }

        .nav-item.active {
            color: var(--accent-color);
        }

        .nav-icon {
            font-size: 20px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 16px;
        }

        .stat-card {
            background: var(--card-bg);
            padding: 14px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
        }

        .stat-val {
            font-size: 18px;
            font-weight: bold;
            margin-top: 4px;
        }
    </style>
</head>
<body>

    <header>
        <div class="avatar" id="user-avatar">U</div>
        <div class="user-info">
            <h1 id="user-name">Загрузка...</h1>
            <div class="balance" id="user-balance">0 ACoin</div>
        </div>
    </header>

    <div id="screen-games" class="content-screen active">
        <h2>Mines Game</h2>
        <div style="max-width: 360px; margin: 0 auto;">
            <div class="mines-panel">
                <div style="display: flex; gap: 12px; margin-bottom: 12px;">
                    <div class="form-group">
                        <label>СТАВКА (AC)</label>
                        <input type="number" id="bet-amount" value="10" min="1">
                    </div>
                    <div class="form-group">
                        <label>КОЛ-ВО МИН</label>
                        <select id="mines-count">
                            <option value="3">3</option>
                            <option value="5" selected>5</option>
                            <option value="10">10</option>
                            <option value="15">15</option>
                            <option value="24">24</option>
                        </select>
                    </div>
                </div>
                <div style="display: flex; gap: 12px;">
                    <button id="btn-start-game" class="btn-action" onclick="startGame()" style="background: var(--accent-color); color: #000;">ИГРАТЬ</button>
                    <button id="btn-cashout" class="btn-action" onclick="cashoutGame()" disabled style="background: var(--gold); color: #000; opacity: 0.5;">ЗАБРАТЬ (x1.00)</button>
                </div>
            </div>
            <div id="mines-grid" style="display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; background: var(--card-bg); padding: 12px; border-radius: 16px; border: 1px solid var(--border-color); pointer-events: none; opacity: 0.6;"></div>
        </div>
    </div>

    <div id="screen-profile" class="content-screen">
        <h2>Мой Профиль</h2>
        <div style="background: var(--card-bg); padding: 16px; border-radius: 16px; border: 1px solid var(--border-color);">
            <div class="stats-grid">
                <div class="stat-card">
                    <div style="font-size: 11px; color: var(--text-muted);">ВИНРЕЙТ</div>
                    <div class="stat-val" id="stat-winrate" style="color: var(--accent-color);">--</div>
                </div>
                <div class="stat-card">
                    <div style="font-size: 11px; color: var(--text-muted);">МАКС. КОЭФФИЦИЕНТ</div>
                    <div class="stat-val" id="stat-max-coef" style="color: var(--gold);">--</div>
                </div>
            </div>
        </div>
    </div>

    <div class="bottom-nav">
        <div class="nav-item active" onclick="switchTab('games', this)">
            <span class="nav-icon">🎮</span><span>Игры</span>
        </div>
        <div class="nav-item" onclick="switchTab('profile', this)">
            <span class="nav-icon">👤</span><span>Профиль</span>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        const BACKEND_URL = "http://localhost:8080"; 
        let isGameActive = false;
        let currentBet = 0;

        if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
            const user = tg.initDataUnsafe.user;
            document.getElementById('user-name').innerText = user.first_name;
            document.getElementById('user-avatar').innerText = user.first_name.charAt(0).toUpperCase();

            fetch(`${BACKEND_URL}/api/profile/${user.id}`)
                .then(res => res.json())
                .then(data => {
                    if (data.balance !== undefined) {
                        updateUIBalance(data.balance);
                        document.getElementById('stat-winrate').innerText = data.winrate;
                        document.getElementById('stat-max-coef').innerText = data.max_coef;
                    }
                });
        } else {
            document.getElementById('user-name').innerText = "Тест";
            updateUIBalance(1000);
        }

        function initGrid() {
            const grid = document.getElementById('mines-grid');
            grid.innerHTML = '';
            for (let i = 0; i < 25; i++) {
                const cell = document.createElement('div');
                cell.style.cssText = `background: var(--card-inner); aspect-ratio: 1; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 22px; cursor: pointer; transition: all 0.2s; border: 1px solid rgba(255,255,255,0.02);`;
                cell.onclick = () => clickCell(i, cell);
                grid.appendChild(cell);
            }
        }
        initGrid();

        function startGame() {
            if (isGameActive) return;
            currentBet = parseFloat(document.getElementById('bet-amount').value);
            const minesCount = parseInt(document.getElementById('mines-count').value);
            const userId = tg.initDataUnsafe?.user?.id || 12345;

            fetch(`${BACKEND_URL}/api/mines/start`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ user_id: userId, bet: currentBet, mines: minesCount })
            })
            .then(res => res.json())
            .then(data => {
                if (data.error) alert(data.error);
                else {
                    isGameActive = true;
                    initGrid();
                    document.getElementById('mines-grid').style.pointerEvents = 'auto';
                    document.getElementById('mines-grid').style.opacity = '1';
                    document.getElementById('btn-start-game').disabled = true;
                    document.getElementById('btn-cashout').disabled = false;
                    document.getElementById('btn-cashout').style.opacity = '1';
                    document.getElementById('btn-cashout').innerText = `ЗАБРАТЬ (x${data.next_coef.toFixed(2)})`;
                    updateUIBalance(data.new_balance);
                }
            });
        }

        function clickCell(index, cellElement) {
            if (!isGameActive || cellElement.dataset.opened === "true") return;
            const userId = tg.initDataUnsafe?.user?.id || 12345;

            fetch(`${BACKEND_URL}/api/mines/step`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ user_id: userId, cell: index })
            })
            .then(res => res.json())
            .then(data => {
                cellElement.dataset.opened = "true";
                if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');

                if (data.status === "win") {
                    cellElement.style.background = "rgba(0, 255, 135, 0.15)";
                    cellElement.innerText = "💎";
                    if (data.auto_cashout) {
                        alert("Максимальный выигрыш!");
                        updateUIBalance(data.new_balance);
                        endGameSession();
                    } else {
                        document.getElementById('btn-cashout').innerText = `ЗАБРАТЬ x${data.next_coef.toFixed(2)}`;
                    }
                } else if (data.status === "gameover") {
                    cellElement.style.background = "rgba(255, 56, 56, 0.2)";
                    cellElement.innerText = "💥";
                    data.all_mines.forEach(mIdx => {
                        const cell = grid.children[mIdx];
                        if (cell && cell.innerText !== "💥") cell.innerText = "💣";
                    });
                    endGameSession();
                    alert("Бум! Конец игры.");
                }
            });
        }

        function cashoutGame() {
            const userId = tg.initDataUnsafe?.user?.id || 12345;
            fetch(`${BACKEND_URL}/api/mines/cashout`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ user_id: userId })
            })
            .then(res => res.json())
            .then(data => {
                updateUIBalance(data.new_balance);
                endGameSession();
                alert(`Забрали ${data.win_amount.toFixed(0)} ACoin`);
            });
        }

        function endGameSession() {
            isGameActive = false;
            document.getElementById('mines-grid').style.pointerEvents = 'none';
            document.getElementById('btn-start-game').disabled = false;
            document.getElementById('btn-cashout').disabled = true;
            document.getElementById('btn-cashout').innerText = `ЗАБРАТЬ (x1.00)`;
        }

        function updateUIBalance(balance) {
            document.getElementById('user-balance').innerText = `${parseFloat(balance).toFixed(0)} ACoin`;
        }

        function switchTab(screenId, element) {
            document.querySelectorAll('.content-screen').forEach(s => s.classList.remove('active'));
            document.getElementById(`screen-${screenId}`).classList.add('active');
        }
    </script>
</body>
</html>
